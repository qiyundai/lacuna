name = "lacuna-api"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "lacuna-db"
database_id = "aa2e68ac-6b77-4c8f-9947-6865d5e8d330"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]

[observability.logs]
enabled = true
invocation_logs = false

[vars]
SYNC_CAPACITY_BYTES = "134217728"
FRONTEND_ORIGIN = "https://lacuna.quietatlas.io"
LEGACY_SYNC_ORIGIN = "https://lacuna-app.pages.dev"
EMAIL_FROM = "Lacuna <lacuna@quietatlas.io>"
STRIPE_PRICE_ID = "price_1Uf7OUCvk8R5hNMik7fgVol1"
OPENAI_MODEL = "gpt-5.4-mini-2026-03-17"
MODEL_INPUT_MICROS_PER_TOKEN = "0.75"
MODEL_OUTPUT_MICROS_PER_TOKEN = "4.5"
REFLECTION_ACCOUNT_MICROS = "750000"
REFLECTION_GLOBAL_MICROS = "15000000"
